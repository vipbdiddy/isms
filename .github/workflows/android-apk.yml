name: Android APK

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # Only the two kinds of processors real Android phones use. Leaving out the emulator
      # kinds (x86, x86_64) roughly halves the download.
      - name: Build the APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - run: cp android/app/build/outputs/apk/release/app-release.apk isms.apk

      - uses: actions/upload-artifact@v4
        with:
          name: isms-apk
          path: app/isms.apk

      # Builds from main become a release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/isms.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Ism's (Android build ${{ github.run_number }})
          body: Install on Android by opening isms.apk on your phone.
          files: app/isms.apk
          make_latest: true
