name: Website

# Publishes https://vipbdiddy.github.io/isms/: the home page, privacy policy and terms (the Markdown
# files at the top of the repository), plus the web version of the app at /isms/app/, for iPhones
# and anyone else without the Android app.
# Needs Settings → Pages → Build and deployment → Source set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build the home page, privacy policy and terms
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the app's packages
        working-directory: app
        run: npm ci

      - name: Build the web version of the app
        working-directory: app
        env:
          CI: 1
          ISMS_WEB_BASE_URL: /isms/app
        run: npx expo export --platform web --output-dir ../web-app

      - name: Put the site together
        run: |
          mkdir site
          cp -r _site/. site/
          cp -r web-app site/app
          # GitHub Pages answers unknown addresses with 404.html. Making that the app lets links
          # straight to a page of the app (like a sign-in link) open it.
          cp web-app/index.html site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
