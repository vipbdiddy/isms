<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">
    <meta name="theme-color" content="#F2F7F6">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description }}">
    <meta property="og:image" content="https://vipbdiddy.github.io/isms/assets/logo.png">
    <link rel="icon" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <style>
      /* The home page, in the app's colours: soft teal, with the logo's gold. */
      :root {
        --background: #f2f7f6;
        --card: #ffffff;
        --ink: #1e3a3a;
        --muted: #5f7a79;
        --accent: #2a7f75;
        --accent-soft: #dcefec;
        --border: #dde9e7;
        --deep: #0a5c52;
        --logo-teal: #008f7a;
        --gold: #cca95b;
        --gold-light: #f0dba5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--background);
        color: var(--ink);
        font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      a { color: var(--accent); }
      a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
      .page { max-width: 720px; margin: 0 auto; padding: 32px 20px 48px; }
      .site-header { text-align: center; margin-bottom: 28px; }
      .site-header img { width: 220px; max-width: 60%; height: auto; }
      .tagline { margin: 8px auto 0; max-width: 34em; font-size: 19px; color: var(--muted); }
      .why {
        position: relative;
        overflow: hidden;
        margin: 0 0 32px;
        padding: 30px 28px 26px;
        border-radius: 24px;
        color: #fff;
        background: radial-gradient(circle at 100% 0, rgba(0, 143, 122, 0.55) 0 150px, transparent 151px), var(--deep);
        box-shadow: 0 12px 32px rgba(10, 92, 82, 0.28);
      }
      .why-emblem { position: absolute; top: 26px; right: 26px; width: 84px; height: auto; }
      .why-label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        color: var(--gold-light);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .why-label::after { content: ""; width: 32px; height: 2px; border-radius: 1px; background: var(--gold); }
      .why-mark { margin: 8px 0 2px; height: 36px; color: var(--gold); font: 64px/1 Georgia, "Times New Roman", serif; }
      .why p { margin: 0; font-size: 19px; line-height: 1.6; }
      .why-swoosh { display: block; width: 200px; height: auto; margin-top: 10px; }
      .intro p { margin: 0 0 16px; }
      .get { margin: 28px 0; padding: 24px; border: 1px solid var(--border); border-radius: 20px; background: var(--card); text-align: center; }
      .get h2 { margin: 0 0 16px; font-size: 20px; }
      .buttons { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      .button {
        display: inline-block;
        padding: 13px 22px;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
      }
      .button.primary { background: var(--accent); color: #fff; }
      .button.secondary { background: var(--accent-soft); color: var(--accent); }
      .button:hover { filter: brightness(0.95); }
      .hint { margin: 16px 0 0; font-size: 15px; color: var(--muted); }
      footer { margin-top: 32px; text-align: center; font-size: 15px; color: var(--muted); }
      footer a { color: var(--muted); white-space: nowrap; }
      @media (max-width: 480px) {
        .page { padding-top: 24px; }
        .why { padding: 26px 22px 22px; }
        .why p { font-size: 17px; }
        .why-emblem { width: 70px; top: 22px; right: 22px; }
        .button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      {{ content }}
    </main>
  </body>
</html>
