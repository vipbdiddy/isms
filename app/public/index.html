<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- "Add to Home Screen" on iPhones and Android phones opens Isms full screen, with its own name and icon.
         The paths start with /isms/app because that's where the web version is published. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Isms" />
    <link rel="apple-touch-icon" href="/isms/app/apple-touch-icon.png" />
    <link rel="manifest" href="/isms/app/manifest.json" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height, in the app's background color */
      html,
      body {
        height: 100%;
        background-color: #f2f7f6;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to use Isms.</noscript>
    <div id="root"></div>
  </body>
</html>
